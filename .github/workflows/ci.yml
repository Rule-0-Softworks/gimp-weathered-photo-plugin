name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
      - name: Install MediaPipe system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-branch --cov-report=xml
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Rule-0-Softworks/gimp-weathered-photo-plugin
          files: coverage.xml
          fail_ci_if_error: true
